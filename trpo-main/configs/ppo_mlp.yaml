algo: ppo

algo_config:
  ent_coef: 0.00
  norm_obj: adv # options: adv, obj
  optimizer: adam
  g_momentum: 0.0
  c_momentum: 0.0
  lr_pi: 0.0003
  lr_v: 0.0003
  weight_decay: 0.0
  weight_decay_type: 'null'
  pi_epochs: 4
  pi_minibatches: 8
  v_epochs: 4
  v_minibatches: 8
  with_popart: True
  adv_type: gae
  cliprange: 0.2
  sigma_type: 'vector' # mu_shared, separate, linear
  cg_damping: 0.0
  cg_steps: 0
  kl_damping: False
  cg_centered: False
  adam_mask: True
  H_samples: null
  grad: 'npg' # 'npg'
  grad_clip: l2 # l2, fisher, empirical
  max_grad_norm: 0.5
  cache_len: 0
  critic_cache: False

env_config: 
  # env_name: mountaincar
  # env_name: carracing
  # env_name: cartpole
  env_name: hopper
  num_envs: 16
  nsteps: 256
  timesteps_per_proc: 5_000_000
  norm_ret: False

nets_config:
  norm_obs: True
  type: mlp
  a_dropout: 0.0
  a_hidden_size: 64
  a_num_layers: 2
  c_hidden_size: 64
  c_num_layers: 2
  c_dropout: 0.0

log_config: 
  log_interval: 10
  n_eval_trials: 20